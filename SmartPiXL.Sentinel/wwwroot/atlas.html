<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPiXL — Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
/* ═══════════════════════════════════════════════════════════
   ATLAS — Tree-driven documentation explorer
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-page:     #080d19;
    --bg-sidebar:  #0b1120;
    --bg-content:  #0e1629;
    --bg-hover:    #162040;
    --bg-selected: #1a2d55;
    --bg-elevated: #141e35;
    --text-1:      #e8ecf4;
    --text-2:      #94a3b8;
    --text-3:      #5a6a80;
    --border:      #1a2540;
    --accent:      #38bdf8;
    --accent-dim:  rgba(56, 189, 248, 0.15);
    --node-platform:  #a78bfa;
    --node-system:    #22d3ee;
    --node-subsystem: #60a5fa;
    --node-component: #34d399;
    --node-probe:     #64748b;
    --health-ok:   #22c55e;
    --health-warn: #eab308;
    --health-fail: #ef4444;
    --health-none: #475569;
    --radius:      6px;
    --font:        'Inter', -apple-system, sans-serif;
    --mono:        'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-page); color: var(--text-1); }

/* ─── LAYOUT ──────────────────────────────────────────── */
body { display: flex; flex-direction: column; overflow: hidden; }

header {
    display: flex; align-items: center; justify-content: space-between;
    height: 52px; padding: 0 20px;
    background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
}
header .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; color: var(--text-2); }
header .brand span { color: var(--accent); }

.tier-bar { display: flex; gap: 2px; background: var(--bg-page); border-radius: var(--radius); padding: 2px; }
.tier-btn {
    padding: 5px 14px; border: none; border-radius: 4px; cursor: pointer;
    font: 500 12px/1 var(--font); color: var(--text-3); background: transparent;
    transition: all 0.15s;
}
.tier-btn:hover { color: var(--text-2); }
.tier-btn.active { background: var(--accent); color: #0c1221; }

main { flex: 1; display: flex; overflow: hidden; }

/* ─── SIDEBAR ─────────────────────────────────────────── */
#sidebar {
    width: 310px; min-width: 310px;
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
}

.search-wrap {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.search-wrap input {
    width: 100%; padding: 7px 10px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-page);
    color: var(--text-1); font: 400 13px var(--font); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-3); }

#tree-container { flex: 1; overflow-y: auto; padding: 8px 0; }

/* Library section */
#library-container { border-top: 1px solid var(--border); padding: 8px 0; overflow-y: auto; max-height: 40%; }
.lib-header {
    padding: 6px 14px; font: 600 11px/1 var(--font); color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
}
.lib-header:hover { color: var(--text-2); }
.lib-group-title {
    padding: 4px 14px 2px 22px; font: 600 10px/1 var(--font); color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.6px; margin-top: 6px;
}

/* ─── TREE NODES ──────────────────────────────────────── */
.tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px 4px calc(var(--depth, 0) * 18px + 8px);
    cursor: pointer; border-radius: 0; transition: background 0.1s;
    font-size: 13px; line-height: 1.4; min-height: 30px;
}
.tree-row:hover { background: var(--bg-hover); }
.tree-row.selected { background: var(--bg-selected); }
.tree-row.match-highlight { background: rgba(56, 189, 248, 0.08); }

.tree-chevron {
    width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; color: var(--text-3); transition: transform 0.15s;
    font-size: 11px;
}
.tree-chevron.collapsed { transform: rotate(-90deg); }
.tree-chevron.leaf { visibility: hidden; }

.health-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.health-dot.ok { background: var(--health-ok); }
.health-dot.warn { background: var(--health-warn); }
.health-dot.fail { background: var(--health-fail); }
.health-dot.none { background: var(--health-none); }

.node-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-1); }
.tree-row:not(.selected) .node-name { color: var(--text-2); }

.type-pill {
    font: 500 9px/1 var(--font); padding: 2px 5px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; opacity: 0.7;
}
.type-pill.platform  { color: var(--node-platform); background: rgba(167,139,250,0.12); }
.type-pill.system    { color: var(--node-system);   background: rgba(34,211,238,0.12); }
.type-pill.subsystem { color: var(--node-subsystem); background: rgba(96,165,250,0.12); }
.type-pill.component { color: var(--node-component); background: rgba(52,211,153,0.12); }
.type-pill.probe     { color: var(--node-probe);    background: rgba(100,116,139,0.12); }

.tree-children { overflow: hidden; }
.tree-children.collapsed { display: none; }

/* Library items */
.lib-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px 4px 28px; cursor: pointer; font-size: 12px;
    color: var(--text-2); transition: background 0.1s;
}
.lib-item:hover { background: var(--bg-hover); color: var(--text-1); }
.lib-item.selected { background: var(--bg-selected); color: var(--text-1); }

/* ─── CONTENT PANEL ───────────────────────────────────── */
#content {
    flex: 1; overflow-y: auto; padding: 40px 48px;
    background: var(--bg-content);
}

.doc-header { margin-bottom: 28px; }
.doc-header h1 {
    font-size: 24px; font-weight: 700; color: var(--text-1);
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.doc-header .subtitle { font-size: 14px; color: var(--text-2); line-height: 1.6; }

.doc-breadcrumb {
    font-size: 12px; color: var(--text-3); margin-bottom: 12px;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.doc-breadcrumb span { cursor: pointer; }
.doc-breadcrumb span:hover { color: var(--accent); }

.tier-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 11px/1 var(--font); color: var(--accent); margin-bottom: 20px;
    padding: 4px 10px; background: var(--accent-dim); border-radius: var(--radius);
}

.doc-body { line-height: 1.75; color: var(--text-2); max-width: 740px; }
.doc-body h2 { font-size: 18px; color: var(--text-1); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.doc-body h3 { font-size: 15px; color: var(--text-1); margin: 20px 0 8px; }
.doc-body h4 { font-size: 13px; color: var(--text-1); margin: 16px 0 6px; }
.doc-body p  { margin: 0 0 12px; }
.doc-body ul, .doc-body ol { margin: 0 0 12px; padding-left: 24px; }
.doc-body li { margin-bottom: 4px; }
.doc-body a  { color: var(--accent); text-decoration: none; }
.doc-body a:hover { text-decoration: underline; }
.doc-body strong { color: var(--text-1); }
.doc-body code {
    font-family: var(--mono); font-size: 12px;
    background: rgba(56, 189, 248, 0.08); color: var(--accent);
    padding: 1px 5px; border-radius: 3px;
}
.doc-body pre {
    background: var(--bg-page); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin: 12px 0;
    overflow-x: auto; font-size: 12px; line-height: 1.6;
}
.doc-body pre code { background: none; padding: 0; color: var(--text-2); }
.doc-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.doc-body th { text-align: left; font-weight: 600; color: var(--text-1); padding: 8px 10px; border-bottom: 2px solid var(--border); }
.doc-body td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); }
.doc-body tr:hover td { background: var(--bg-hover); }
.doc-body blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; color: var(--text-2); background: var(--accent-dim); border-radius: 0 var(--radius) var(--radius) 0; }
.doc-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

/* Tier hints when no content */
.tier-hints { margin-top: 16px; }
.tier-hints .hint-label { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.tier-hint-btn {
    display: inline-block; padding: 4px 10px; margin: 3px 4px 3px 0;
    font: 500 11px/1 var(--font); border-radius: var(--radius);
    border: 1px solid var(--border); color: var(--text-2); cursor: pointer;
    background: transparent; transition: all 0.15s;
}
.tier-hint-btn:hover { border-color: var(--accent); color: var(--accent); }

.no-content {
    padding: 32px; text-align: center; color: var(--text-3);
    border: 1px dashed var(--border); border-radius: var(--radius);
    margin-top: 8px;
}
.no-content p { margin: 4px 0; }

/* Welcome state */
.welcome { max-width: 560px; margin: 0 auto; padding-top: 60px; }
.welcome h2 { font-size: 20px; color: var(--text-1); margin-bottom: 12px; }
.welcome p { color: var(--text-2); line-height: 1.7; margin-bottom: 16px; font-size: 14px; }
.welcome .tree-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin: 24px 0;
}
.welcome .stat {
    text-align: center; padding: 14px; background: var(--bg-elevated);
    border-radius: var(--radius); border: 1px solid var(--border);
}
.welcome .stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.welcome .stat .label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.welcome .hint { font-size: 13px; color: var(--text-3); margin-top: 20px; }

/* Health status bar in doc header */
.health-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    font-size: 12px; color: var(--text-3);
}
.health-bar .ratio { font-weight: 600; }
.health-bar .ratio.ok { color: var(--health-ok); }
.health-bar .ratio.warn { color: var(--health-warn); }
.health-bar .ratio.fail { color: var(--health-fail); }

/* Children overview in doc */
.children-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px; margin-top: 16px;
}
.child-card {
    padding: 10px 12px; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 8px;
}
.child-card:hover { border-color: var(--accent); background: var(--bg-hover); }
.child-card .cc-name { font-size: 12px; color: var(--text-2); flex: 1; }
.child-card .cc-type { font-size: 9px; color: var(--text-3); text-transform: uppercase; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #2a3a5a; }
    </style>
</head>
<body>

<header>
    <div class="brand"><span>Atlas</span> · SmartPiXL</div>
    <div class="tier-bar" id="tierBar">
        <button class="tier-btn active" data-tier="pitch">Overview</button>
        <button class="tier-btn" data-tier="management">Architecture</button>
        <button class="tier-btn" data-tier="technical">Technical</button>
        <button class="tier-btn" data-tier="walkthrough">Deep Dive</button>
    </div>
</header>

<main>
    <aside id="sidebar">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Filter nodes…" autocomplete="off">
        </div>
        <div id="tree-container"></div>
        <div id="library-container"></div>
    </aside>
    <article id="content">
        <div id="doc"></div>
    </article>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   ATLAS ENGINE
   ═══════════════════════════════════════════════════════════ */

// ── STATE ──────────────────────────────────────────────
let treeData    = null;
let docMap      = {};
let selectedId  = null;
let currentTier = 'pitch';

// ── TREE-NODE → DOC-SLUG mapping ──────────────────────
// Maps Health.Node slugs to MarkdownAtlasService section slugs.
const NODE_DOC = {
    'smartpixl':            'architecture-overview',
    'edge':                 'architecture-edge',
    'forge':                'architecture-forge',
    'sentinel':             'architecture-sentinel',
    'forge.f2-enrichment':  'subsystems-enrichment-pipeline',
    'forge.f4-failover':    'subsystems-failover',
    'forge.f5-etl':         'subsystems-etl',
};

const TIERS = {
    pitch:       { label: 'Overview',     field: 'pitchHtml',       desc: 'High-level overview for any audience' },
    management:  { label: 'Architecture', field: 'managementHtml',  desc: 'How it works — design and data flow' },
    technical:   { label: 'Technical',    field: 'technicalHtml',   desc: 'Implementation details for engineers' },
    walkthrough: { label: 'Deep Dive',    field: 'walkthroughHtml', desc: 'Code walkthrough and configuration' },
};

// ── INIT ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    const [treeResp, sectionsResp] = await Promise.all([
        fetch('/api/health-tree').then(r => r.json()),
        fetch('/api/atlas/sections').then(r => r.json()),
    ]);

    treeData = treeResp;
    for (const s of sectionsResp) docMap[s.slug] = s;

    renderTree();
    renderLibrary();
    showWelcome();
    setupListeners();
});

// ── EVENTS ─────────────────────────────────────────────
function setupListeners() {
    document.querySelectorAll('.tier-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.tier-btn.active')?.classList.remove('active');
            btn.classList.add('active');
            currentTier = btn.dataset.tier;
            if (selectedId) refreshContent();
        });
    });

    const search = document.getElementById('searchInput');
    let t;
    search.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => filterTree(search.value.trim().toLowerCase()), 150);
    });
}

// ── TREE ───────────────────────────────────────────────
function renderTree() {
    const c = document.getElementById('tree-container');
    if (!treeData?.root) { c.innerHTML = '<div class="no-content"><p>Health tree unavailable</p></div>'; return; }
    c.innerHTML = '';
    buildNode(treeData.root, c, 0, []);
}

function buildNode(node, parent, depth, ancestors) {
    const kids = node.children && node.children.length > 0;

    const row = document.createElement('div');
    row.className = 'tree-row';
    row.style.setProperty('--depth', depth);
    row.dataset.slug = node.slug;
    row.dataset.nodeType = node.nodeType;
    row.dataset.name = (node.name || '').toLowerCase();

    const chev = document.createElement('div');
    chev.className = 'tree-chevron' + (kids ? '' : ' leaf');
    chev.textContent = kids ? '▸' : '';
    row.appendChild(chev);

    const dot = document.createElement('div');
    dot.className = 'health-dot ' + healthCls(node);
    row.appendChild(dot);

    const nm = document.createElement('span');
    nm.className = 'node-name';
    nm.textContent = node.name;
    row.appendChild(nm);

    const pill = document.createElement('span');
    pill.className = 'type-pill ' + node.nodeType;
    pill.textContent = node.nodeType;
    row.appendChild(pill);

    parent.appendChild(row);

    let childBox = null;
    if (kids) {
        childBox = document.createElement('div');
        childBox.className = 'tree-children';
        // Auto-collapse probe-only groups at depth > 0
        if (node.children.every(c => c.nodeType === 'probe') && depth > 0) {
            childBox.classList.add('collapsed');
            chev.classList.add('collapsed');
        }
        parent.appendChild(childBox);
        for (const child of node.children) buildNode(child, childBox, depth + 1, [...ancestors, node]);
    }

    row.addEventListener('click', e => {
        if (kids && e.target.closest('.tree-chevron')) {
            chev.classList.toggle('collapsed');
            childBox.classList.toggle('collapsed');
            return;
        }
        selectTree(node, ancestors);
    });
    if (kids) row.addEventListener('dblclick', () => { chev.classList.toggle('collapsed'); childBox.classList.toggle('collapsed'); });
}

function healthCls(n) {
    if (n.ratio == null) return 'none';
    if (n.ratio >= 1) return 'ok';
    if (n.ratio > 0) return 'warn';
    return 'fail';
}

function selectTree(node, ancestors) {
    selectedId = 'tree:' + node.slug;
    clearSel();
    document.querySelector(`.tree-row[data-slug="${node.slug}"]`)?.classList.add('selected');
    showTreeDoc(node, ancestors);
}

// ── LIBRARY ────────────────────────────────────────────
function renderLibrary() {
    const c = document.getElementById('library-container');
    const mapped = new Set(Object.values(NODE_DOC));

    const groups = {};
    for (const [slug, sec] of Object.entries(docMap)) {
        if (mapped.has(slug)) continue;
        const cat = sec.category || 'Other';
        (groups[cat] ??= []).push(sec);
    }
    if (!Object.keys(groups).length) { c.style.display = 'none'; return; }

    const hdr = document.createElement('div');
    hdr.className = 'lib-header';
    hdr.textContent = '▾ Library';
    c.appendChild(hdr);

    const body = document.createElement('div');
    body.id = 'library-body';
    c.appendChild(body);

    hdr.addEventListener('click', () => {
        const hidden = body.style.display === 'none';
        body.style.display = hidden ? '' : 'none';
        hdr.textContent = (hidden ? '▾' : '▸') + ' Library';
    });

    const order = ['Architecture', 'Subsystems', 'Deep Dives', 'Database', 'Operations', 'Other'];
    for (const cat of Object.keys(groups).sort((a, b) => (order.indexOf(a) === -1 ? 99 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 99 : order.indexOf(b)))) {
        const title = document.createElement('div');
        title.className = 'lib-group-title';
        title.textContent = cat;
        body.appendChild(title);
        for (const sec of groups[cat].sort((a, b) => a.sortOrder - b.sortOrder)) {
            const item = document.createElement('div');
            item.className = 'lib-item';
            item.dataset.slug = sec.slug;
            item.dataset.name = (sec.title || '').toLowerCase();
            item.textContent = sec.title;
            item.addEventListener('click', () => selectLib(sec));
            body.appendChild(item);
        }
    }
}

function selectLib(sec) {
    selectedId = 'lib:' + sec.slug;
    clearSel();
    document.querySelector(`.lib-item[data-slug="${sec.slug}"]`)?.classList.add('selected');
    showLibDoc(sec);
}

// ── CONTENT ────────────────────────────────────────────
function refreshContent() {
    if (!selectedId) return;
    if (selectedId.startsWith('tree:')) {
        const r = findNode(treeData.root, selectedId.slice(5));
        if (r) showTreeDoc(r.node, r.ancestors);
    } else {
        const sec = docMap[selectedId.slice(4)];
        if (sec) showLibDoc(sec);
    }
}

function showTreeDoc(node, ancestors) {
    const el = document.getElementById('doc');
    const sec = docMap[NODE_DOC[node.slug]] || null;
    const tier = TIERS[currentTier];
    const html = sec ? sec[tier.field] : null;

    let out = '';

    // Breadcrumb
    if (ancestors.length) {
        out += '<div class="doc-breadcrumb">';
        for (const a of ancestors) out += `<span onclick="navTo('${a.slug}')">${esc(a.name)}</span> <span style="color:var(--text-3)">›</span> `;
        out += `<span style="color:var(--text-1)">${esc(node.name)}</span></div>`;
    }

    // Header
    out += '<div class="doc-header">';
    out += `<h1>${esc(node.name)} <span class="type-pill ${node.nodeType}">${node.nodeType}</span></h1>`;
    if (node.description) out += `<div class="subtitle">${esc(node.description)}</div>`;

    // Health bar for aggregate nodes
    if (node.total > 0) {
        const cls = node.ratio >= 1 ? 'ok' : node.ratio > 0 ? 'warn' : 'fail';
        out += `<div class="health-bar"><span class="ratio ${cls}">${node.healthy}/${node.total} healthy</span><span>(${Math.round((node.ratio || 0) * 100)}%)</span></div>`;
    } else if (node.health != null) {
        const cls = node.health === 1 ? 'ok' : 'fail';
        out += `<div class="health-bar"><span class="ratio ${cls}">${node.health === 1 ? 'Live' : 'Down'}</span></div>`;
    }
    out += '</div>';

    // Tier indicator
    out += `<div class="tier-indicator">◆ ${tier.label} — ${tier.desc}</div>`;

    // Content
    if (html) {
        out += `<div class="doc-body">${html}</div>`;
    } else {
        out += noContent(sec, node);
    }

    // Children grid for parent nodes with no doc content
    if (!html && node.children?.length) {
        out += '<h3 style="margin-top:24px;font-size:14px;color:var(--text-2)">Child Nodes</h3>';
        out += '<div class="children-grid">';
        for (const child of node.children) {
            out += `<div class="child-card" onclick="navTo('${child.slug}')">`;
            out += `<div class="health-dot ${healthCls(child)}"></div>`;
            out += `<span class="cc-name">${esc(child.name)}</span>`;
            out += `<span class="cc-type">${child.nodeType}</span>`;
            out += '</div>';
        }
        out += '</div>';
    }

    el.innerHTML = out;
    document.getElementById('content').scrollTop = 0;
}

function showLibDoc(sec) {
    const el = document.getElementById('doc');
    const tier = TIERS[currentTier];
    const html = sec[tier.field];

    let out = '';
    out += '<div class="doc-header">';
    out += `<h1>${esc(sec.title)} <span style="font-size:12px;color:var(--text-3);font-weight:400">${sec.category}</span></h1>`;
    out += '</div>';
    out += `<div class="tier-indicator">◆ ${tier.label} — ${tier.desc}</div>`;
    out += html ? `<div class="doc-body">${html}</div>` : noContent(sec, null);

    el.innerHTML = out;
    document.getElementById('content').scrollTop = 0;
}

function noContent(sec, node) {
    const avail = [];
    if (sec) for (const [k, t] of Object.entries(TIERS)) { if (sec[t.field]) avail.push({ k, label: t.label }); }

    let h = '<div class="no-content">';
    h += `<p>No <strong>${TIERS[currentTier].label}</strong> content yet for this ${node ? node.nodeType : 'section'}.</p>`;
    if (avail.length) {
        h += '<div class="tier-hints"><div class="hint-label">Available tiers:</div>';
        for (const a of avail) h += `<button class="tier-hint-btn" onclick="switchTier('${a.k}')">${a.label}</button>`;
        h += '</div>';
    } else {
        h += '<p style="margin-top:12px;font-size:13px">Documentation is being developed. The tree provides the structure — content fills in as the platform matures.</p>';
    }
    h += '</div>';
    return h;
}

function showWelcome() {
    const el = document.getElementById('doc');
    const c = countTypes(treeData?.root);

    el.innerHTML = `
        <div class="welcome">
            <h2>SmartPiXL Atlas</h2>
            <p>Atlas is the documentation layer built on the Health.Node tree — the same tree that drives infrastructure monitoring. Every tree node can carry documentation at four depth tiers, from a high-level overview down to code-level detail.</p>
            <p>Select a node from the tree to explore, or browse the Library for deep dives and reference docs.</p>
            <div class="tree-summary">
                <div class="stat"><div class="num">${c.system}</div><div class="label">Systems</div></div>
                <div class="stat"><div class="num">${c.subsystem}</div><div class="label">Subsystems</div></div>
                <div class="stat"><div class="num">${c.component}</div><div class="label">Components</div></div>
                <div class="stat"><div class="num">${c.probe}</div><div class="label">Probes</div></div>
            </div>
            <div class="tree-summary">
                <div class="stat"><div class="num">${Object.keys(docMap).length}</div><div class="label">Sections</div></div>
            </div>
            <p class="hint">Use the tier selector in the header to control documentation depth.</p>
        </div>`;
}

// ── HELPERS ─────────────────────────────────────────────
function clearSel() { document.querySelectorAll('.tree-row.selected, .lib-item.selected').forEach(e => e.classList.remove('selected')); }

function findNode(root, slug) {
    function walk(n, anc) {
        if (n.slug === slug) return { node: n, ancestors: anc };
        if (n.children) for (const ch of n.children) { const r = walk(ch, [...anc, n]); if (r) return r; }
        return null;
    }
    return walk(root, []);
}

function navTo(slug) {
    expandTo(slug);
    const r = findNode(treeData.root, slug);
    if (r) selectTree(r.node, r.ancestors);
}

function expandTo(slug) {
    const row = document.querySelector(`.tree-row[data-slug="${slug}"]`);
    if (!row) return;
    let el = row.parentElement;
    while (el && el.id !== 'tree-container') {
        if (el.classList.contains('tree-children') && el.classList.contains('collapsed')) {
            el.classList.remove('collapsed');
            el.previousElementSibling?.querySelector('.tree-chevron')?.classList.remove('collapsed');
        }
        el = el.parentElement;
    }
}

function switchTier(tier) {
    document.querySelector('.tier-btn.active')?.classList.remove('active');
    document.querySelector(`.tier-btn[data-tier="${tier}"]`)?.classList.add('active');
    currentTier = tier;
    refreshContent();
}

function countTypes(n) {
    const c = { platform: 0, system: 0, subsystem: 0, component: 0, probe: 0 };
    if (!n) return c;
    (function w(x) { if (c[x.nodeType] !== undefined) c[x.nodeType]++; x.children?.forEach(w); })(n);
    return c;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── SEARCH ─────────────────────────────────────────────
function filterTree(q) {
    document.querySelectorAll('.tree-row').forEach(r => { r.classList.remove('match-highlight'); r.style.display = ''; });
    document.querySelectorAll('.lib-item').forEach(i => i.style.display = '');

    if (!q) return;

    document.querySelectorAll('.tree-row').forEach(row => {
        if ((row.dataset.name || '').includes(q) || (row.dataset.slug || '').includes(q)) {
            row.classList.add('match-highlight');
            // Expand parents
            let el = row.parentElement;
            while (el && el.id !== 'tree-container') {
                if (el.classList.contains('tree-children') && el.classList.contains('collapsed')) {
                    el.classList.remove('collapsed');
                    el.previousElementSibling?.querySelector('.tree-chevron')?.classList.remove('collapsed');
                }
                el = el.parentElement;
            }
        }
    });

    document.querySelectorAll('.lib-item').forEach(item => {
        if (!(item.dataset.name || '').includes(q) && !(item.dataset.slug || '').includes(q)) item.style.display = 'none';
    });
}
</script>
